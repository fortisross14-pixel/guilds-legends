name: Build

# The game is hosted on Vercel, which builds and deploys every push to main.
# This workflow only checks that lint and the build pass, so a failed build
# is visible on GitHub too.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      # Tests are paused until Phase 8 of docs/PROJECT_PLAN.md (prototype mode); they get rebuilt then.
      - name: Build
        run: npm run build
