<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" font-family="Georgia, serif">
  <rect width="1120" height="760" fill="#f3e6c8"/>
  <rect x="10" y="10" width="1100" height="740" fill="none" stroke="#8a6a3c" stroke-width="3" rx="10"/>
  <text x="30" y="48" font-size="26" font-weight="bold" fill="#3b2412">Guilds of Legend · roads and places (plan)</text>
  <text x="30" y="72" font-size="14" fill="#5a4630">Town → road: days to reach the road · road → town: days from the road's far end. Days pass on the loading screen of each leg.</text>

  <!-- later chapters (dim) -->
  <g opacity="0.45" stroke="#7a6a55" stroke-width="2" stroke-dasharray="6 6" fill="none">
    <path d="M400 610 L700 640"/><path d="M700 640 L860 540"/><path d="M860 540 L800 360"/><path d="M800 360 L720 170"/><path d="M720 170 L950 250"/>
  </g>
  <g opacity="0.55" font-size="14" fill="#5a4630" text-anchor="middle">
    <circle cx="700" cy="640" r="9" fill="#bfae90"/><text x="700" y="666">Tidecross</text>
    <circle cx="860" cy="540" r="9" fill="#bfae90"/><text x="860" y="566">Sunspire</text>
    <circle cx="800" cy="360" r="11" fill="#bfae90" stroke="#3b2412" stroke-width="2"/><text x="812" y="340" font-weight="bold">Mooncourt</text>
    <circle cx="720" cy="170" r="9" fill="#bfae90"/><text x="720" y="196">Thornwatch</text>
    <circle cx="950" cy="250" r="9" fill="#bfae90"/><text x="950" y="276">Skyreach</text>
    <text x="920" y="690" font-size="15" font-style="italic">Chapter 2 and later (Champion status):</text>
    <text x="920" y="710" font-size="15" font-style="italic">roads and days to be planned</text>
  </g>

  <!-- Chapter 1 legs -->
  <g stroke="#6b4a2b" stroke-width="4" fill="none">
    <path d="M300 400 L190 400"/><path d="M190 400 L80 400"/>
    <path d="M285 380 L215 270"/><path d="M215 270 L115 180"/>
    <path d="M320 380 L395 265"/><path d="M395 265 L470 160"/>
  </g>
  <g stroke="#6b4a2b" stroke-width="4" fill="none" stroke-dasharray="10 7">
    <path d="M485 170 L560 285"/><path d="M560 285 L620 410"/>
    <path d="M605 430 L520 525"/><path d="M520 525 L415 600"/>
  </g>

  <g stroke="#6b4a2b" stroke-width="4" fill="none" stroke-dasharray="10 7">
    <path d="M390 598 L270 520"/><path d="M270 520 L292 422"/>
    <path d="M640 412 L715 385"/><path d="M715 385 L790 362"/>
  </g>

  <!-- day labels -->
  <g font-size="15" font-weight="bold" fill="#3b2412" text-anchor="middle">
    <rect x="226" y="382" width="34" height="22" rx="4" fill="#fff8e6" stroke="#6b4a2b"/><text x="243" y="398">1d</text>
    <rect x="118" y="382" width="34" height="22" rx="4" fill="#fff8e6" stroke="#6b4a2b"/><text x="135" y="398">1d</text>
    <rect x="232" y="312" width="34" height="22" rx="4" fill="#fff8e6" stroke="#6b4a2b"/><text x="249" y="328">1d</text>
    <rect x="148" y="214" width="34" height="22" rx="4" fill="#fff8e6" stroke="#6b4a2b"/><text x="165" y="230">1d</text>
    <rect x="340" y="312" width="34" height="22" rx="4" fill="#fff8e6" stroke="#6b4a2b"/><text x="357" y="328">2d</text>
    <rect x="416" y="200" width="34" height="22" rx="4" fill="#fff8e6" stroke="#6b4a2b"/><text x="433" y="216">1d</text>
    <rect x="505" y="216" width="34" height="22" rx="4" fill="#fff8e6" stroke="#6b4a2b"/><text x="522" y="232">2d</text>
    <rect x="574" y="336" width="34" height="22" rx="4" fill="#fff8e6" stroke="#6b4a2b"/><text x="591" y="352">2d</text>
    <rect x="547" y="466" width="34" height="22" rx="4" fill="#fff8e6" stroke="#6b4a2b"/><text x="564" y="482">1d</text>
    <rect x="452" y="552" width="34" height="22" rx="4" fill="#fff8e6" stroke="#6b4a2b"/><text x="469" y="568">2d</text>
    <rect x="312" y="556" width="34" height="22" rx="4" fill="#fff8e6" stroke="#6b4a2b"/><text x="329" y="572">2d</text>
    <rect x="252" y="456" width="34" height="22" rx="4" fill="#fff8e6" stroke="#6b4a2b"/><text x="269" y="472">1d</text>
    <rect x="652" y="374" width="34" height="22" rx="4" fill="#fff8e6" stroke="#6b4a2b"/><text x="669" y="390">2d</text>
    <rect x="740" y="352" width="34" height="22" rx="4" fill="#fff8e6" stroke="#6b4a2b"/><text x="757" y="368">2d</text>
  </g>

  <!-- roads (pills) -->
  <g font-size="14" text-anchor="middle" fill="#2a1d12">
    <rect x="135" y="384" width="110" height="34" rx="17" fill="#cfe2b8" stroke="#2f6b3a" stroke-width="2.5" transform="translate(0 -1)"/>
    <text x="190" y="406" font-weight="bold">The Old Road</text>
    <rect x="160" y="253" width="110" height="34" rx="17" fill="#cfe2b8" stroke="#2f6b3a" stroke-width="2.5"/>
    <text x="215" y="274" font-weight="bold">Blackwood track</text>
    <rect x="330" y="248" width="130" height="34" rx="17" fill="#cfe2b8" stroke="#2f6b3a" stroke-width="2.5"/>
    <text x="395" y="270" font-weight="bold">Thornwood road</text>
    <rect x="505" y="268" width="110" height="34" rx="17" fill="#ece0c4" stroke="#6b4a2b" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="560" y="290" font-weight="bold">The Iron Road</text>
    <rect x="465" y="508" width="110" height="34" rx="17" fill="#ece0c4" stroke="#6b4a2b" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="520" y="530" font-weight="bold">The cliff road</text>
    <rect x="215" y="503" width="110" height="34" rx="17" fill="#ece0c4" stroke="#6b4a2b" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="270" y="525" font-weight="bold">The coast road</text>
    <rect x="660" y="368" width="110" height="34" rx="17" fill="#ece0c4" stroke="#6b4a2b" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="715" y="390" font-weight="bold">The Moon Road</text>
  </g>

  <!-- places -->
  <g text-anchor="middle" fill="#2a1d12">
    <circle cx="300" cy="400" r="22" fill="#a3242b" stroke="#3b2412" stroke-width="3"/>
    <text x="300" y="448" font-size="19" font-weight="bold">Dunmere</text><text x="300" y="466" font-size="13" fill="#5a4630">home · two gates (west, east)</text>
    <circle cx="470" cy="150" r="17" fill="#2f6b3a" stroke="#3b2412" stroke-width="3"/>
    <text x="470" y="122" font-size="18" font-weight="bold">Greenhollow</text>
    <circle cx="620" cy="420" r="20" fill="#6b4a2b" stroke="#3b2412" stroke-width="3"/>
    <text x="620" y="462" font-size="18" font-weight="bold">Ironford</text><text x="620" y="480" font-size="13" fill="#5a4630">city · three roads</text>
    <circle cx="405" cy="610" r="17" fill="#244c8f" stroke="#3b2412" stroke-width="3"/>
    <text x="405" y="646" font-size="18" font-weight="bold">Windmere</text>
    <rect x="58" y="386" width="30" height="30" fill="#e4e1d8" stroke="#3b2412" stroke-width="3" transform="rotate(45 73 401)"/>
    <text x="75" y="444" font-size="16" font-weight="bold">Dawnwatch</text><text x="75" y="462" font-size="16" font-weight="bold">Temple</text><text x="75" y="480" font-size="12" fill="#5a4630">dead end</text>
    <rect x="98" y="164" width="30" height="30" fill="#5d3477" stroke="#3b2412" stroke-width="3" transform="rotate(45 113 179)"/>
    <text x="113" y="146" font-size="16" font-weight="bold">Blackwood edge</text><text x="113" y="222" font-size="12" fill="#5a4630">dead end</text>
  </g>

  <!-- gates -->
  <g font-size="12.5" fill="#7a2342" font-style="italic">
    <text x="128" y="372">locked until mission 2 (a companion)</text>
    <text x="150" y="303">locked until mission 5 (end of Act I)</text>
    <text x="372" y="240">locked until mission 4 (the Ash Abbot)</text>
    <text x="120" y="560">locked until mission 4</text>
    <text x="660" y="420">locked until Chapter 2</text>
  </g>

  <!-- legend -->
  <g font-size="14" fill="#2a1d12">
    <rect x="30" y="580" width="300" height="150" rx="8" fill="#fff8e6" stroke="#8a6a3c"/>
    <text x="45" y="604" font-weight="bold">Legend</text>
    <rect x="45" y="616" width="46" height="20" rx="10" fill="#cfe2b8" stroke="#2f6b3a" stroke-width="2"/><text x="100" y="631">walkable road (a wild area)</text>
    <rect x="45" y="644" width="46" height="20" rx="10" fill="#ece0c4" stroke="#6b4a2b" stroke-width="2" stroke-dasharray="5 3"/><text x="100" y="659">road on the map only (for now)</text>
    <circle cx="68" cy="684" r="9" fill="#a3242b" stroke="#3b2412" stroke-width="2"/><text x="100" y="689">town or city</text>
    <rect x="61" y="702" width="14" height="14" fill="#e4e1d8" stroke="#3b2412" stroke-width="2" transform="rotate(45 68 709)"/><text x="100" y="714">site at a road's end</text>
  </g>
  <g font-size="14" fill="#2a1d12">
    <rect x="360" y="680" width="480" height="62" rx="8" fill="#fff8e6" stroke="#8a6a3c"/>
    <text x="375" y="700">Dunmere → Greenhollow: 2d + 1d = 3 days</text>
    <text x="375" y="718">Dunmere → Ironford: 3 + 4 = 7 days (via Greenhollow) or 3 + 3 = 6 (via Windmere)</text>
    <text x="375" y="736">The loop: Dunmere · Greenhollow · Ironford · Windmere · Dunmere</text>
  </g>
</svg>
